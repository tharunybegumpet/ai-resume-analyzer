# ==========================================
# AI Resume Analyzer - Application Config
# ==========================================

# Server
server.port=8080
server.servlet.context-path=/api

# ==========================================
# MySQL DataSource
# ==========================================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==========================================
# JPA / Hibernate
# ==========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ==========================================
# JWT Configuration
# ==========================================
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=86400000

# ==========================================
# File Upload
# ==========================================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
app.upload.dir=uploads

# ==========================================
# Gemini API
# ==========================================
gemini.api.key=${GEMINI_API_KEY:your_gemini_api_key_here}
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash-lite:generateContent

# ==========================================
# Logging
# ==========================================
logging.level.com.resumeanalyzer=INFO
logging.level.org.springframework.security=WARN
